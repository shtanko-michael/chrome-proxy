<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>SOCKS5 Proxy — Настройки</title>
  <style>
    :root { color-scheme: light; --bg:#f6f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --accent:#3b82f6; --border:#e5e7eb; --danger:#dc2626; }
    body { margin:0; padding:24px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    .container { max-width:640px; margin:0 auto; }
    h1 { margin:0 0 16px; font-size:22px; }
    .card { margin-bottom:16px; padding:16px; border:1px solid var(--border); border-radius:12px; background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.04); }
    .section-title { margin-bottom:12px; color:var(--muted); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
    label { display:block; margin:10px 0; font-weight:600; }
    label span { display:block; margin-bottom:6px; color:var(--muted); font-size:13px; font-weight:500; }
    input { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:#fff; }
    .form-row { display:grid; grid-template-columns:1fr 2fr; gap:12px; }
    button { padding:9px 12px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; font:inherit; }
    button:hover { filter:brightness(.95); }
    button.secondary { border:1px solid var(--border); background:#fff; color:var(--text); }
    button.danger { border:1px solid #fecaca; background:#fff; color:var(--danger); }
    .actions { display:flex; gap:8px; margin-top:12px; }
    .list { list-style:none; margin:14px 0 0; padding:0; }
    .list li { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--border); }
    .server-info { min-width:0; }
    .server-name { display:block; font-weight:650; }
    .server-url,.domain { color:var(--muted); font:12px ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .item-actions { display:flex; flex:none; gap:6px; }
    .item-actions button { padding:6px 9px; font-size:12px; }
    .muted { color:var(--muted); font-size:13px; }
    #status { min-height:20px; margin:12px 0; padding:0 2px; font-size:14px; }
    #status.success { color:#047857; } #status.error { color:#b91c1c; }
    @media (max-width:540px) { .form-row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="container">
    <h1>Настройки прокси</h1>
    <section class="card">
      <div class="section-title">Серверы</div>
      <div class="form-row">
        <label><span>Название</span><input id="proxyName" type="text" placeholder="Германия"></label>
        <label><span>Адрес прокси</span><input id="proxyUrl" type="text" placeholder="socks5://host:1080"></label>
      </div>
      <div class="actions">
        <button id="saveProxy" type="button">Добавить сервер</button>
        <button id="cancelEdit" class="secondary" type="button" hidden>Отмена</button>
      </div>
      <ul id="proxyList" class="list"></ul>
      <details class="muted">
        <summary>Формат адреса</summary>
        <p>Используйте <code>socks5://host:port</code>. Также сохранена поддержка <code>socks5h</code>, <code>http</code> и <code>https</code>.</p>
      </details>
    </section>

    <section class="card">
      <div class="section-title">Домены с прокси</div>
      <p class="muted">Если список пуст, через прокси идет весь трафик. Если домены добавлены — только они.</p>
      <label><span>Добавить домен</span><input id="domainInput" type="text" placeholder="example.com"></label>
      <button id="addDomain" class="secondary" type="button">Добавить</button>
      <ul id="domainList" class="list"></ul>
    </section>
    <div id="status" role="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
